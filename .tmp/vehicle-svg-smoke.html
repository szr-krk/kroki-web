<!doctype html>
<meta charset="utf-8">
<title>Vehicle SVG Smoke</title>
<pre id="result">pending</pre>
<script src="../src/data/vehicle-catalog-data.js?smoke=2"></script>
<script src="../src/core/vehicleCatalog.js?smoke=2"></script>
<script src="../src/core/shapeRegistry.js?smoke=2"></script>
<script src="../src/adapters/vehicleAdapter.js?smoke=2"></script>
<script>
  (() => {
    const catalog = window.Kroki?.VehicleCatalog;
    const renderer = window.Kroki?.VehicleRenderer;
    const variants = catalog?.allVariants?.() || [];
    const failures = [];
    const rendered = [];
    variants.forEach((variant) => {
      ["top", "side", "upsideDown"].forEach((view) => {
        if (!catalog.supportsView(variant, view)) return;
        try {
          const svg = renderer.renderPreviewSvg(variant, { view });
          const pathCount = svg.querySelectorAll("path").length;
          rendered.push({ key: variant.key, view, pathCount });
          if (!pathCount) failures.push({ key: variant.key, view, reason: "no-path" });
        } catch (error) {
          failures.push({ key: variant.key, view, reason: String(error?.message || error) });
        }
      });
    });
    document.querySelector("#result").textContent = JSON.stringify({
      variantCount: variants.length,
      renderedCount: rendered.length,
      customCount: variants.filter((variant) => variant.views).length,
      failures,
      sample: rendered.slice(0, 10)
    });
  })();
</script>
