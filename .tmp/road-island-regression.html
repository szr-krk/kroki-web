<!doctype html>
<meta charset="utf-8">
<svg id="editorCanvas" viewBox="0 0 1200 800">
  <g id="editorObjects"></g>
  <g id="editorEditLayer"></g>
</svg>
<pre id="result">pending</pre>
<script src="../src/editor-stroke-style.js"></script>
<script src="../src/core/shapeRegistry.js"></script>
<script src="../src/core/styleManager.js"></script>
<script src="../src/core/editorObjectManager.js"></script>
<script src="../src/geometry/lineGeometry.js"></script>
<script src="../src/adapters/roadAdapter.js"></script>
<script src="../src/core/roadIntersectionEngine.js"></script>
<script>
(() => {
  const output = document.getElementById("result");
  const Kroki = window.Kroki || {};
  const manager = Kroki.EditorObjectManager;
  const roadAdapter = Kroki.ShapeRegistry?.get?.("road");
  const engine = Kroki.RoadIntersectionEngine;

  function waitFrame() {
    return new Promise((resolve) => requestAnimationFrame(() => resolve()));
  }

  function assert(condition, message, details = {}) {
    if (!condition) {
      const error = new Error(message);
      error.details = details;
      throw error;
    }
  }

  function roadConfig(overrides = {}) {
    return {
      laneCount: 2,
      laneWidth: 50,
      laneWidths: [50, 50],
      leftShoulder: { enabled: false, width: 0 },
      rightShoulder: { enabled: false, width: 0 },
      marking: { style: "dash", width: 2 },
      edgeLine: { enabled: true, width: 2 },
      autoIntersection: true,
      segments: [{ from: 0, to: 1, markingStyle: "dash" }],
      ...overrides
    };
  }

  function addRoad(id, geometry, config = {}) {
    const model = roadAdapter.create({
      geometry,
      metadata: { road: roadConfig(config) }
    });
    model.id = id;
    return manager.add(model, { skipHistory: true, controlPoints: false, styleControls: false });
  }

  function reset() {
    manager.clear({ skipHistory: true, controlPoints: false, styleControls: false });
    engine.clear?.();
  }

  async function rebuild() {
    engine.rebuild?.();
    await waitFrame();
    await waitFrame();
  }

  function islandBoundaryRangeStats(boundaryId, islandId = "island") {
    const paths = Array.from(document.querySelectorAll(`[data-object-id='${islandId}'] .editor-road-edge[data-road-boundary-id='${boundaryId}']`));
    const ranges = paths.map((path) => {
      const from = Number(path.dataset.visibleFrom);
      const to = Number(path.dataset.visibleTo);
      if (Number.isFinite(from) && Number.isFinite(to)) return { from, to, length: Math.max(0, to - from) };
      return { from: 0, to: 1, length: 1 };
    });
    return {
      pathCount: paths.length,
      totalVisible: ranges.reduce((sum, range) => sum + range.length, 0),
      ranges,
      d: paths.map((path) => path.getAttribute("d") || "")
    };
  }

  function innerIslandRangeStats(islandId = "island") {
    return islandBoundaryRangeStats("b0", islandId);
  }

  function outerIslandRangeStats(islandId = "island") {
    const model = manager.get?.(islandId);
    const config = roadAdapter.roadConfig?.(model, model?.metadata?.road);
    const section = roadAdapter.crossSection?.(config);
    const boundaries = section?.boundaries || [];
    const outer = boundaries[boundaries.length - 1];
    return islandBoundaryRangeStats(outer?.id || "b1", islandId);
  }

  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function edgeAndContourPaths() {
    return Array.from(document.querySelectorAll(
      ".editor-road-edge,#roadIntersectionContourLayer .road-intersection-outer-contour-styled,#roadIntersectionContourLayer .road-intersection-outer-contour-q"
    ));
  }

  function minDistanceToVisibleEdge(point) {
    let best = Infinity;
    edgeAndContourPaths().forEach((path) => {
      let length = 0;
      try {
        length = path.getTotalLength();
      } catch {
        length = 0;
      }
      const steps = Math.max(6, Math.ceil(length / 4));
      for (let index = 0; index <= steps; index += 1) {
        const sample = path.getPointAtLength(length * index / steps);
        best = Math.min(best, distance(point, sample));
      }
    });
    return best;
  }

  function assertIslandMouthsOpen(center, outerRadius, angles, label) {
    const mouths = angles.map((angle) => {
      const point = {
        x: center.x + Math.cos(angle) * outerRadius,
        y: center.y + Math.sin(angle) * outerRadius
      };
      return { point, minStrokeDistance: minDistanceToVisibleEdge(point) };
    });
    assert(
      mouths.every((item) => item.minStrokeDistance > 8),
      `${label} ada dis cemberi baglanti agzini kapatiyor`,
      mouths
    );
    return mouths;
  }

  function annulusDistanceInfo(point, center, innerRadius, outerRadius) {
    const radius = distance(point, center);
    return {
      radius,
      insideAnnulus: radius > innerRadius + 4 && radius < outerRadius - 4
    };
  }

  function pathCommandCount(path) {
    return ((path.getAttribute("d") || "").match(/[MLCQZ]/g) || []).length;
  }

  function assertNoStraightContourStubsInsideIsland(center, innerRadius, outerRadius, label) {
    const offenders = [];
    Array.from(document.querySelectorAll("#roadIntersectionContourLayer .road-intersection-outer-contour-styled")).forEach((path) => {
      if (pathCommandCount(path) !== 2) return;
      let length = 0;
      try {
        length = path.getTotalLength();
      } catch {
        length = 0;
      }
      const steps = Math.max(8, Math.ceil(length / 8));
      for (let index = 0; index <= steps; index += 1) {
        const point = path.getPointAtLength(length * index / steps);
        const info = annulusDistanceInfo(point, center, innerRadius, outerRadius);
        if (info.insideAnnulus) {
          offenders.push({
            point: { x: point.x, y: point.y },
            radius: info.radius,
            d: path.getAttribute("d") || ""
          });
          break;
        }
      }
    });
    assert(!offenders.length, `${label} yol konturu ada halkasinin icinde artik birakiyor`, offenders);
    return true;
  }

  function assertClippedRoadOwnedOuterRing(label, minVisible = 0.08, islandId = "island") {
    const stats = outerIslandRangeStats(islandId);
    const contourOwnedCount = document.querySelectorAll(
      "#roadIntersectionContourLayer .road-intersection-outer-contour-styled,#roadIntersectionContourLayer .road-intersection-outer-contour-q"
    ).length;
    if (!stats.pathCount) {
      assert(
        contourOwnedCount > 0,
        `${label} ada dis konturu road ya da contour path'i olarak uretilmiyor`,
        { ...stats, contourOwnedCount }
      );
      return { ...stats, contourOwnedCount, contourOwned: true };
    }
    assert(
      stats.totalVisible > minVisible,
      `${label} ada dis konturu fazla kirpiliyor`,
      stats
    );
    assert(
      stats.totalVisible < 0.985 || contourOwnedCount > 0,
      `${label} ada dis konturu road path'i olarak tam ciziliyor`,
      stats
    );
    return { ...stats, contourOwnedCount, contourOwned: false };
  }

  function roadBoundaryRanges(roadId, boundaryId) {
    return Array.from(document.querySelectorAll(`[data-object-id='${roadId}'] .editor-road-edge[data-road-boundary-id='${boundaryId}']`)).map((path) => ({
      from: Number(path.dataset.visibleFrom),
      to: Number(path.dataset.visibleTo),
      d: path.getAttribute("d") || ""
    }));
  }

  async function islandIntersectionCase() {
    const center = { x: 600, y: 400 };
    const outerRadius = 150;
    reset();
    addRoad("island", {
      profile: "islandRing",
      center,
      innerDiameter: 160,
      outerDiameter: outerRadius * 2
    }, {
      laneCount: 1,
      laneWidth: 70,
      laneWidths: [70]
    });
    addRoad("west", { profile: "straight", start: { x: 170, y: 400 }, end: { x: 488, y: 400 } });
    addRoad("east", { profile: "straight", start: { x: 1030, y: 400 }, end: { x: 712, y: 400 } });
    addRoad("north", { profile: "straight", start: { x: 600, y: 70 }, end: { x: 600, y: 288 } });
    addRoad("south", { profile: "straight", start: { x: 600, y: 730 }, end: { x: 600, y: 512 } });
    await rebuild();
    const stats = innerIslandRangeStats();
    assert(stats.pathCount > 0, "Ada ic kontur path'i uretilmedi", stats);
    assert(stats.totalVisible > 0.985, "Ada ic konturu kavsak kirpmasinda kayboluyor", stats);
    const outerStats = assertClippedRoadOwnedOuterRing("Dort kollu");
    const mouths = assertIslandMouthsOpen(center, outerRadius, [Math.PI, 0, -Math.PI / 2, Math.PI / 2], "Dort kollu");
    return {
      innerIsland: stats,
      outerIsland: outerStats,
      mouths,
      intersectionShapes: engine.getLastIntersectionShapes?.().length || 0,
      outerContours: engine.getLastOuterContours?.().length || 0,
      contourNodes: document.querySelectorAll("#roadIntersectionContourLayer .road-intersection-outer-contour-styled").length
    };
  }

    addRoad("vertical", { profile: "straight", start: { x: 600, y: 60 }, end: { x: 600, y: 740 } });
    await rebuild();
    const stats = innerIslandRangeStats();
    assert(stats.pathCount > 0, "Tam gecen yollarda ada ic kontur path'i uretilmedi", stats);
    assert(stats.totalVisible > 0.985, "Tam gecen yollarda ada ic konturu kavsak kirpmasinda kayboluyor", stats);
    const outerStats = assertClippedRoadOwnedOuterRing("Tam gecen yol");
    const mouths = assertIslandMouthsOpen(center, outerRadius, [Math.PI, 0, -Math.PI / 2, Math.PI / 2], "Tam gecen yol");
    return {
      innerIsland: stats,
      outerIsland: outerStats,
      mouths,
      intersectionShapes: engine.getLastIntersectionShapes?.().length || 0,
      outerContours: engine.getLastOuterContours?.().length || 0,
      contourNodes: document.querySelectorAll("#roadIntersectionContourLayer .road-intersection-outer-contour-styled").length
    };
  }

  async function islandEightApproachCase() {
    reset();
    const center = { x: 600, y: 400 };
    const outerRadius = 150;
    addRoad("island", {
      profile: "islandRing",
      center,
      innerDiameter: 160,
      outerDiameter: outerRadius * 2
    }, {
      laneCount: 1,
      laneWidth: 70,
      laneWidths: [70]
    });
    for (let index = 0; index < 8; index += 1) {
      const angle = index * Math.PI / 4;
      const dir = { x: Math.cos(angle), y: Math.sin(angle) };
      addRoad("approach-" + index, {
        profile: "straight",
        start: {
          x: center.x + dir.x * 520,
          y: center.y + dir.y * 520
        },
        end: {
          x: center.x + dir.x * 122,
          y: center.y + dir.y * 122
        }
      });
    }
    await rebuild();
    const stats = innerIslandRangeStats();
    assert(stats.pathCount > 0, "Sekiz yaklasimli adada ic kontur path'i uretilmedi", stats);
    assert(stats.totalVisible > 0.985, "Sekiz yaklasimli adada ic kontur kavsak kirpmasinda kayboluyor", stats);
    const angles = Array.from({ length: 8 }, (_, index) => index * Math.PI / 4);
    const outerStats = assertClippedRoadOwnedOuterRing("Sekiz yaklasimli");
    const mouths = assertIslandMouthsOpen(center, outerRadius, angles, "Sekiz yaklasimli");
    return {
      innerIsland: stats,
      outerIsland: outerStats,
      mouths,
      intersectionShapes: engine.getLastIntersectionShapes?.().length || 0,
      outerContours: engine.getLastOuterContours?.().length || 0,
      contourNodes: document.querySelectorAll("#roadIntersectionContourLayer .road-intersection-outer-contour-styled").length
    };
  }

  async function islandThirdRoadSideCase(side) {
    const center = { x: 600, y: 400 };
    const outerRadius = 150;
    reset();
    addRoad("island", {
      profile: "islandRing",
      center,
      innerDiameter: 160,
      outerDiameter: outerRadius * 2
    }, {
      laneCount: 1,
      laneWidth: 70,
      laneWidths: [70]
    });
    addRoad("north", { profile: "straight", start: { x: 600, y: 70 }, end: { x: 600, y: 288 } });
    addRoad("south", { profile: "straight", start: { x: 600, y: 730 }, end: { x: 600, y: 512 } });
    if (side === "right") {
      addRoad("east", { profile: "straight", start: { x: 1030, y: 400 }, end: { x: 712, y: 400 } });
    } else {
      addRoad("west", { profile: "straight", start: { x: 170, y: 400 }, end: { x: 488, y: 400 } });
    }
    await rebuild();
    const innerStats = innerIslandRangeStats();
    assert(innerStats.pathCount > 0, `${side} ucuncu yolda ada ic kontur path'i uretilmedi`, innerStats);
    assert(innerStats.totalVisible > 0.985, `${side} ucuncu yolda ada ic kontur kirpiliyor`, innerStats);
    const outerStats = assertClippedRoadOwnedOuterRing(`${side} ucuncu yol`);
    const sideAngle = side === "right" ? 0 : Math.PI;
    const mouths = assertIslandMouthsOpen(center, outerRadius, [-Math.PI / 2, Math.PI / 2, sideAngle], `${side} ucuncu yol`);
    return {
      innerIsland: innerStats,
      outerIsland: outerStats,
      mouths,
      intersectionShapes: engine.getLastIntersectionShapes?.().length || 0,
      outerContours: engine.getLastOuterContours?.().length || 0,
      contourNodes: document.querySelectorAll("#roadIntersectionContourLayer .road-intersection-outer-contour-styled").length
    };
  }

    addRoad("south", { profile: "straight", start: { x: 602, y: 552 }, end: { x: 602, y: 816 } });
    addRoad("east", { profile: "straight", start: { x: 741, y: 388 }, end: { x: 1101, y: 388 } });

    const outerStats = assertClippedRoadOwnedOuterRing("Iki seritli");

  async function islandContourStubCase() {
    const center = { x: 528.6654357910156, y: 418.0725402832031 };
    const innerRadius = 80;
    const outerRadius = 180;
    reset();
    addRoad("west", { profile: "straight", start: { x: 155.99555206298828, y: 420.1976013183594 }, end: { x: 388.5474853515625, y: 420.1976013183594 } });
    addRoad("east", { profile: "straight", start: { x: 670.0656433105469, y: 414.2825622558594 }, end: { x: 924.6328125, y: 414.2825622558594 } });
    addRoad("north", { profile: "straight", start: { x: 529.4165344238281, y: 275.72454833984375 }, end: { x: 529.4165344238281, y: 110.48884558677673 } });
    addRoad("south", { profile: "straight", start: { x: 531.4806213378906, y: 776.5578155517578 }, end: { x: 531.4806213378906, y: 575.6210248470306 } });
    addRoad("island", {
      profile: "islandRing",
      center,
      innerDiameter: innerRadius * 2,
      outerDiameter: outerRadius * 2
    }, {

    });
    await rebuild();

    assert(innerStats.pathCount > 0, "Artik orneginde ada ic kontur path'i uretilmedi", innerStats);
    assert(innerStats.totalVisible > 0.985, "Artik orneginde ada ic kontur kirpiliyor", innerStats);
    const outerStats = assertClippedRoadOwnedOuterRing("Artik ornegi");

      innerIsland: innerStats,

      contourNodes: document.querySelectorAll("#roadIntersectionContourLayer .road-intersection-outer-contour-styled").length
    };

  async function islandEditedQResidueCase() {
    const center = { x: 600, y: 400 };
    const innerRadius = 80;
    const outerRadius = 180;
    const islandId = "obj_mr57xxqc_6";
    reset();
    addRoad("obj_mr57xk0g_2", { profile: "straight", start: { x: 114.31394958496094, y: 395.6092224121094 }, end: { x: 449.90126037597656, y: 395.6092224121094 } });
    addRoad("obj_mr57xnf3_3", { profile: "straight", start: { x: 750.53564453125, y: 386.38641357421875 }, end: { x: 1020.2612915039062, y: 386.38641357421875 } });
    addRoad("obj_mr57xpoz_4", { profile: "straight", start: { x: 601.6859741210938, y: 254.22173309326172 }, end: { x: 601.6859741210938, y: 6.581779479980469 } });
    addRoad("obj_mr57xt5n_5", { profile: "straight", start: { x: 605.635498046875, y: 794.7245483398438 }, end: { x: 605.635498046875, y: 547.0845947265625 } });
    addRoad(islandId, {
      profile: "islandRing",
      center,
      innerDiameter: innerRadius * 2,
      outerDiameter: outerRadius * 2
    }, {
      laneCount: 2,
      laneWidth: 50,
      laneWidths: [50, 50]
    });
    await rebuild();
    const baselineOuter = assertClippedRoadOwnedOuterRing("Q duzenleme oncesi", 0.08, islandId);
    const qBefore = engine.getLastQSegments?.() || [];
    assert(qBefore.length >= 4, "Q duzenleme ornegi yeterli yuvarlatma uretmedi", qBefore);
    engine.importState({
      version: 1,
      qEndpointEdits: [
        { key: "intersection:obj_mr57xk0g_2:b2~obj_mr57xxqc_6:b2:q:0", entryCut: 88, exitCut: 82 },
        { key: "intersection:obj_mr57xt5n_5:b0~obj_mr57xxqc_6:b2:q:0", entryCut: 72, exitCut: 116 },
        { key: "intersection:obj_mr57xt5n_5:b2~obj_mr57xxqc_6:b2:q:0", entryCut: 115, exitCut: 68 },
        { key: "intersection:obj_mr57xnf3_3:b2~obj_mr57xxqc_6:b2:q:0", entryCut: 60, exitCut: 73 }
      ]
    }, { skipRefresh: true });
    await rebuild();
    const innerStats = innerIslandRangeStats(islandId);
    const editedOuter = assertClippedRoadOwnedOuterRing("Q duzenleme sonrasi", 0.2, islandId);
    const qAfter = engine.getLastQSegments?.() || [];
    assert(innerStats.totalVisible > 0.985, "Q duzenleme sonrasi ada ic kontur kirpiliyor", innerStats);
    assert(qAfter.length >= 4 && qAfter.every((item) => / Q /.test(item.d || "")), "Q duzenleme sonrasi yuvarlatmalar korunmuyor", qAfter);
    assert(
      baselineOuter.totalVisible - editedOuter.totalVisible > 0.12,
      "Q endpoint ada dis konturu boyunca cekilince road-owned dis cember artiklari temizlenmiyor",
      { baselineOuter, editedOuter, qAfter }
    );
    assert(
      editedOuter.totalVisible < 0.48,
      "Q duzenleme sonrasi ada dis konturu fazla uzun kaliyor",
      { baselineOuter, editedOuter, qAfter }
    );
    assertNoStraightContourStubsInsideIsland(center, innerRadius, outerRadius, "Q duzenleme ornegi");
    return {
      innerIsland: innerStats,
      baselineOuter,
      editedOuter,
      qBefore,
      qAfter,
      intersectionShapes: engine.getLastIntersectionShapes?.().length || 0,
      outerContours: engine.getLastOuterContours?.().length || 0,
      contourNodes: document.querySelectorAll("#roadIntersectionContourLayer .road-intersection-outer-contour-styled").length
    };
  }

  async function islandShoulderUpperQCase() {
    const center = { x: 669.0411376953125, y: 412.0548095703125 };
    const islandId = "obj_mr58n4ny_2";
    const westId = "obj_mr58n9s3_3";
    const southId = "obj_mr58nqk2_5";
    const northId = "obj_mr58nz00_6";
    const eastId = "obj_mr58neu5_4";
    const shoulderConfig = {
      leftShoulder: { enabled: true, width: 20 },
      rightShoulder: { enabled: true, width: 20 }
    };
    reset();
    addRoad(islandId, {
      profile: "islandRing",
      center,
      innerDiameter: 160,
      outerDiameter: 360
    }, {
      laneCount: 2,
      laneWidth: 50,
      laneWidths: [50, 50]
    });
    addRoad(westId, { profile: "straight", start: { x: 264.7332344055176, y: 417.14837646484375 }, end: { x: 527.6995315551758, y: 417.14837646484375 } }, shoulderConfig);
    addRoad(southId, { profile: "straight", start: { x: 672.967658996582, y: 741.9913635253906 }, end: { x: 672.967658996582, y: 557.4740600585938 } }, shoulderConfig);
    addRoad(northId, { profile: "straight", start: { x: 668.0354080200195, y: 258.91510009765625 }, end: { x: 668.0354080200195, y: 74.39779663085938 } }, shoulderConfig);
    addRoad(eastId, { profile: "straight", start: { x: 811.5493965148926, y: 407.96490478515625 }, end: { x: 1066.1991348266602, y: 407.96490478515625 } }, shoulderConfig);
    await rebuild();
    const qSegments = engine.getLastQSegments?.() || [];
    const keys = qSegments.map((item) => item.key || "");
    const upperQ = qSegments.filter((item) => item.control?.y < center.y);
    const lowerQ = qSegments.filter((item) => item.control?.y > center.y);
    const expectedPairs = [
      `${islandId}:b2~${westId}:b0`,
      `${islandId}:b2~${westId}:b4`,
      `${islandId}:b2~${southId}:b0`,
      `${islandId}:b2~${southId}:b4`,
      `${islandId}:b2~${northId}:b0`,
      `${islandId}:b2~${northId}:b4`,
      `${islandId}:b2~${eastId}:b0`,
      `${islandId}:b2~${eastId}:b4`
    ];
    assert(qSegments.length >= 8, "Banketli ada ornegi tum kollarda Q uretmiyor", qSegments);
    assert(upperQ.length >= 4 && lowerQ.length >= 4, "Ada merkez x ekseninin iki tarafinda da Q uretilmeli", qSegments);
    assert(
      expectedPairs.every((pair) => keys.some((key) => key.includes(pair))),
      "Banketli ada orneginde bazi dis banket Q eslesmeleri eksik",
      { keys, expectedPairs }
    );
    const eastTopShoulder = roadBoundaryRanges(eastId, "b1");
    const eastBottomShoulder = roadBoundaryRanges(eastId, "b3");
    assert(eastTopShoulder.some((range) => range.from > 0.05), "Saat 3 ust banket cizgisi ada agzinda kirpilmiyor", eastTopShoulder);
    assert(eastBottomShoulder.some((range) => range.from > 0.05), "Saat 3 alt banket cizgisi ada agzinda kirpilmiyor", eastBottomShoulder);
    return {
      qCount: qSegments.length,
      upperQ: upperQ.length,
      lowerQ: lowerQ.length,
      eastTopShoulder,
      eastBottomShoulder,
      outerIsland: assertClippedRoadOwnedOuterRing("Banketli ust Q", 0.2, islandId)
    };
  }

  async function normalIntersectionCase() {
    reset();
    addRoad("horizontal", { profile: "straight", start: { x: 250, y: 400 }, end: { x: 950, y: 400 } });
    addRoad("vertical", { profile: "straight", start: { x: 600, y: 120 }, end: { x: 600, y: 680 } });
    await rebuild();
    const shapes = engine.getLastIntersectionShapes?.() || [];
    const contours = engine.getLastOuterContours?.() || [];
    const styledNodes = document.querySelectorAll("#roadIntersectionContourLayer .road-intersection-outer-contour-styled").length;
    assert(shapes.length > 0, "Adasiz kavsak intersection shape uretmedi", { shapes: shapes.length });
    assert(contours.length > 0 || styledNodes > 0, "Adasiz kavsak dis kontur uretmedi", { contours: contours.length, styledNodes });
    return {
      intersectionShapes: shapes.length,
      outerContours: contours.length,
      contourNodes: styledNodes
    };
  }

  (async () => {
    try {
      const results = {
        ok: true,
        island: await islandIntersectionCase(),
        islandThrough: await islandThroughRoadCase(),
        islandEightApproach: await islandEightApproachCase(),
        islandThirdRoadLeft: await islandThirdRoadSideCase("left"),
        islandThirdRoadRight: await islandThirdRoadSideCase("right"),
        islandTwoLaneAttachment: await islandTwoLaneAttachmentCase(),
        islandContourStub: await islandContourStubCase(),
        islandEditedQResidue: await islandEditedQResidueCase(),
        islandShoulderUpperQ: await islandShoulderUpperQCase(),
        normal: await normalIntersectionCase()
      };
      output.textContent = JSON.stringify(results, null, 2);
    } catch (error) {
      output.textContent = JSON.stringify({
        ok: false,
        message: error?.message || String(error),
        details: error?.details || null,
        stack: error?.stack || ""
      }, null, 2);
    }
  })();
})();
</script>
