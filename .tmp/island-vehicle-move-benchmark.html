<!doctype html>
<meta charset="utf-8">
<svg id="editorCanvas" viewBox="0 0 1200 800">
  <g id="editorObjects"></g>
  <g id="editorEditLayer"></g>
</svg>
<pre id="result">pending</pre>
<script src="../src/editor-stroke-style.js"></script>
<script src="../src/core/shapeRegistry.js"></script>
<script src="../src/data/vehicle-catalog-data.js"></script>
<script src="../src/core/vehicleCatalog.js"></script>
<script src="../src/core/styleManager.js"></script>
<script src="../src/core/editorObjectManager.js"></script>
<script src="../src/core/controlPointManager.js"></script>
<script src="../src/geometry/lineGeometry.js"></script>
<script src="../src/adapters/roadAdapter.js"></script>
<script src="../src/core/roadIntersectionEngine.js"></script>
<script src="../src/adapters/vehicleAdapter.js"></script>
<script>
(() => {
  const output = document.getElementById("result");
  const registry = window.Kroki.ShapeRegistry;
  const manager = window.Kroki.EditorObjectManager;
  const controls = window.Kroki.ControlPointManager;

  function waitFrame() {
    return new Promise((resolve) => requestAnimationFrame(() => resolve()));
  }

  function createVehicle() {
    return registry.get("vehicle").create({
      variant: window.Kroki.VehicleCatalog.findVariant("09/cekici-ve-dorse"),
      metadata: { vehicleView: "top", vehicleColor: "#ff0000" },
      geometry: { cx: 500, cy: 260, scale: 1, rotation: 10 }
    });
  }

  function createIslandRoad() {
    return registry.get("road").create({
      geometry: {
        profile: "islandRing",
        center: { x: 620, y: 380 },
        innerDiameter: 110,
        outerDiameter: 260,
        laneCount: 2,
        laneWidth: 32
      },
      road: {
        autoIntersection: true,
        fill: "#e5e7eb"
      }
    });
  }

  async function bench(name, withIsland) {
    manager.clear({ skipHistory: true, controlPoints: false, styleControls: false });
    if (withIsland) manager.add(createIslandRoad(), { skipHistory: true, controlPoints: false, styleControls: false });
    const vehicle = manager.add(createVehicle(), { skipHistory: true, controlPoints: false, styleControls: false });
    controls.show(vehicle.id, "edit");
    window.Kroki.RoadIntersectionEngine?.rebuild?.();
    await waitFrame();

    const iterations = 1000;
    const samples = [];
    for (let run = 0; run < 5; run += 1) {
      const start = performance.now();
      for (let index = 0; index < iterations; index += 1) {
        manager.updateGeometry(vehicle.id, (draft) => {
          draft.geometry.cx += 0.45;
          draft.geometry.cy += 0.2;
        }, { skipHistory: true, styleControls: false });
      }
      await waitFrame();
      samples.push(performance.now() - start);
    }
    const total = samples.reduce((sum, value) => sum + value, 0) / samples.length;
    return {
      name,
      iterations,
      samples,
      avgTotalMs: total,
      avgPerMoveMs: total / iterations,
      roadNodes: document.querySelectorAll(".editor-road *").length,
      contourNodes: document.querySelectorAll("#roadIntersectionContourLayer *").length
    };
  }

  (async () => {
    try {
      const results = [
        await bench("noIsland", false),
        await bench("withIsland", true)
      ];
      output.textContent = JSON.stringify(results);
    } catch (error) {
      output.textContent = String(error && error.stack ? error.stack : error);
    }
  })();
})();
</script>
